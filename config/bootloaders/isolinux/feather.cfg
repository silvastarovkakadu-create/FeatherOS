label featheros-live
    menu label ^Start FeatherOS
    menu default
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash panic=0 username=feather hostname=featheros locales=en_US.UTF-8 keyboard-layouts=us

label featheros-debug
    menu label FeatherOS (^Debug Mode)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components debug loglevel=7 systemd.show_status=1 systemd.log_level=debug plymouth.enable=0 rd.plymouth=0 panic=0 console=tty0 console=ttyS0,115200 username=feather hostname=featheros locales=en_US.UTF-8 keyboard-layouts=us

label featheros-safe
    menu label FeatherOS - ^Safe Graphics
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components nomodeset plymouth.enable=0 rd.plymouth=0 panic=0 featheros.safe_graphics=1 username=feather hostname=featheros locales=en_US.UTF-8 keyboard-layouts=us
