label live-amd64
	menu label Start FeatherOS
	linux /live/vmlinuz
	append boot=live components quiet splash username=feather hostname=featheros locales=en_US.UTF-8 keyboard-layouts=us console=tty0 console=ttyS0,115200 --- initrd=/live/initrd.img

initrd /live/initrd.img

label live-amd64-failsafe
	menu label FeatherOS (Debug Mode)
	linux /live/vmlinuz
	append boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788 --- initrd=/live/initrd.img

initrd /live/initrd.img
